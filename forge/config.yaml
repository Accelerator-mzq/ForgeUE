schema: spec-driven

# 测试命令（forge verify 阶段使用 test.test_command）
test:
  test_command: python -m pytest -q

# 项目 context（可选）
# 创建 artifact 时会展示给 AI。
# 在这里填技术栈、约定、风格指南、领域知识等。
# 示例：
#   context: |
#     技术栈：TypeScript / React / Node.js
#     使用 conventional commits 规范
#     领域：电商平台

# 按 artifact 类型自定义规则（可选）
# 为特定 artifact 类型增加规则。
# 示例：
#   rules:
#     proposal:
#       - proposal 控制在 500 字以内
#       - 必须包含 "Non-goals" 段落
#     tasks:
#       - 任务拆分为不超过 2 小时的块

# ---------------------------------------------------------------------------
# ForgeUE 项目 context + rules（2026-04-24 起采用 OpenSpec；2026-05-17 迁移至 forge）
# ---------------------------------------------------------------------------

context: |
  所有 forge 制品默认使用简体中文撰写，包括 proposal、design、tasks 以及变更过程中新增的说明性文档。
  保留这些内容的原样格式或原文，不要翻译：文件名、目录名、front matter key、schema 名称、命令、路径、代码、能力标识、Markdown checklist 语法。
  如果模板或规范要求固定关键字，也必须保留原样，例如 spec 控制关键字、状态标记和其他机器可解析语法。
  ForgeUE 是一个 UE 生产链多模型运行时框架。

  定位：
  - 基础设施层（LiteLLM / Instructor / httpx）直接使用，不做封装。
  - 多模态 worker（ComfyUI / Qwen / Hunyuan image+3D / Tripo3D）作为外部 provider 外挂接入。
  - UE 领域对象与运行时工程完全自研。

  核心对象模型（见 docs/requirements/SRS.md §1.4）：
  - Task, Run, Workflow, Step, Artifact, PayloadRef, Lineage
  - ReviewReport, Verdict, Checkpoint, DryRunPass
  - UEOutputTarget, UEAssetManifest, UEImportPlan, Evidence
  - ModelRegistry, PreparedRoute, CapabilityRouter, BudgetTracker, TransitionEngine

  Provider 路由：
  - ModelRegistry（config/models.yaml，三段式：providers / models / aliases）是单一 source of truth。
  - Bundle JSON 通过 provider_policy.models_ref 引用 alias；loader 将其展开为 prepared_routes。
  - CapabilityRouter 按注册顺序调用 ProviderAdapter.supports(model)；LiteLLMAdapter（wildcard）必须最后注册。

  权威文档：
  - docs/ 五件套（SRS / HLD / LLD / test_spec / acceptance_report）仍是长期的需求 / 设计 / 测试 / 验收知识库。
  - forge/specs/ 是精简的行为契约层，不替代 docs/。
  - forge/changes/ 是未来变更的入口，不用于重写历史文档。
  - CHANGELOG.md 是近期变更的事实来源之一。
  - tests/ + examples/ + probes/ 是验收事实来源（bundle 内是端到端真实对象流，不 mock）。

  运行环境：
  - Windows 11 + Git-Bash + D: 盘，Python 3.12+。
  - /tmp/... 禁用（Git-Bash 会翻译到 C: 系统临时目录）。
  - 产物只落在 ./artifacts/<YYYY-MM-DD>/<run_id>/ 或 ./demo_artifacts/<YYYY-MM-DD>/。

  不可妥协的规则：
  - 不要硬编码 provider model id，除非 bundle 显式允许。
  - 不要提交 artifacts/、demo_artifacts/、.env、API key 或机器绝对路径。
  - 不要把 docs/ 的大段内容复制到 forge/ artifact 里。
  - 不要把 forge/ 当作普通文档目录。
  - 外部事实数据（pricing、endpoint、版本号）必须带可验证的 sourced_on + source_url，或保持 null 并附 TODO（ADR-004）。
  - 贵族按次计费 API（如 mesh.generation，~$0.20-1/job，ADR-007）严禁框架级静默重试；CLI 暴露 job_id 给用户，用户查询远端状态后再决定是否 --resume。

rules:
  proposal: |
    - 标题与正文使用简体中文，清楚说明做什么、为什么做、范围边界是什么。
    - 非平凡的新需求（新对象 / 新 workflow / 新 provider / 新 step type / 跨子系统重构 / 架构边界变更）在实施前必须先有 forge proposal。
    - 小 bugfix 可以跳过 proposal，但必须补回归测试或显式说明验证方式（见 CLAUDE.md "每条 Codex review 修复 = 一条新回归测试"）。
    - proposal 必须说明：ForgeUE 为什么需要它、解决什么问题、不解决什么、影响哪些模块、不影响哪些、成功判定标准。
    - 不要把 SRS / HLD / LLD 的大段内容复制到 proposal 里；引用对应章节即可。

  design: |
    - 标题与正文使用简体中文，技术术语可保留英文原词，必要时补充中文解释。
    - design 必须按 src/framework/ 实际布局来写，不要凭想象画目录树。
    - design 必须列出所触及的 capability spec（runtime-core / artifact-contract / workflow-orchestrator / review-engine / provider-routing / ue-export-bridge / probe-and-validation / examples-and-acceptance）。
    - design 不得硬编码 provider model id；使用 config/models.yaml 中的 alias。
    - 涉及付费 provider、mesh worker、贵族按次计费 API 的 design 必须显式声明：opt-in 机制、重复计费风险、probe 流程（见 CHANGELOG.md TBD-007 / ADR-007）。

  tasks: |
    - 任务描述使用简体中文，保持 Markdown checklist 语法和代码/路径原文不变。
    - 每个 task 必须可被 Claude Code 或其他 coding agent 独立执行和验证。
    - tasks.md 末尾必须包含 "## Documentation Sync" 章节，列出 archive 前要同步检查的 docs/ 五件套(SRS / HLD / LLD / test_spec / acceptance_report)。
    - 测试相关 task 不得硬编码测试总数；以 `python -m pytest -q` 实测输出为准。
    - 付费 provider 相关 task 默认通过环境变量 opt-in（如 FORGEUE_PROBE_VISUAL_REVIEW=1、FORGEUE_PROBE_HUNYUAN_3D=1）；框架级测试用 FakeAdapter / FakeComfyWorker 离线运行。

  specs: |
    - 标题与正文使用简体中文，技术术语可保留英文原词，必要时补充中文解释。
    - delta spec 不得复制完整 main spec；只描述本次 change 引入的 ADDED / MODIFIED / REMOVED 行为。
    - delta spec 的 Validation 段必须指向具体测试文件路径，不要写测试总数。
    - delta spec 必须包含 Non-Goals 段。

  general: |
    - 标题与正文使用简体中文，技术术语可保留英文原词，必要时补充中文解释。
    - 用中文沟通；库名 / API / 文件路径 / 类名 / capability key 等标识符保留英文。
    - 外部 review 意见（Codex / adversarial）在采纳前必须独立对照真实代码验证（见 CLAUDE.md / AGENTS.md）。
    - 决策风格：先给分析 + 选项 + 取舍，得到一次授权后就完整执行；避免执行中途反复微确认。
    - 临时脚本（python -c、heredoc）使用 ASCII 标记 [OK] / [FAIL] / [SKIP]；禁用 emoji（Windows GBK stdout 遇 emoji 会崩，见 probes/README.md 和 CLAUDE.md）。
    - 当 README / CHANGELOG / docs 五件套之间数字不一致时，标记为 doc drift 并以 `python -m pytest -q` 实测为准。不要默默挑一个数字。
