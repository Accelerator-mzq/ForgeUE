schema: forge-legacy-requirements/v1
requirements:
  - id: LR-0001
    title: FR-WF-001 三种 RunMode 支持
    description: 系统应支持三种 RunMode:basic_llm(1-3 步)、production(5-15 步,含嵌入 review)、standalone_review(3-5 步评审链)
    status: implemented
    source:
      document: docs/requirements/SRS.md
      section: FR-WF-001
      kind: srs
    evidence:
      - src/framework/core/enums.py:7-10 — RunMode(str, Enum) 定义 basic_llm / production / standalone_review 三个成员
      - "src/framework/core/task.py:69 — Task.run_mode: RunMode 字段声明"
      - src/framework/runtime/orchestrator.py:180 — arun() 在 run span 中记录 run_mode.value
    confidence: high
    priority:
    review: confirmed
    notes: ""
